description = ""
authors = [
    {name = "Zhe Rao",email = "zheraoeminem@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.149.0,<0.150.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]


[build-system]
